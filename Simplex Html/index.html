<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zona Franca Chat</title>
</head>

<body>
    <style>
        /* ── Variables de imagen ── */
        :root {
            --icon-closed: url("https://zcbdgpiohdtlvmvcpemu.supabase.co/storage/v1/object/public/static/assets/images/icon-clona-avatar-closed.png");
            --icon-opened: url("https://zcbdgpiohdtlvmvcpemu.supabase.co/storage/v1/object/public/static/assets/images/icon-clona-avatar-opened.png");
        }

        /* ── Overlay ── */
        #embed-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            z-index: 999;
        }

        #embed-overlay.active {
            display: block;
        }

        /* ── Contenedor del chat ── */
        #embed-container {
            display: none;
            position: fixed;
            bottom: 100px;
            right: 20px;
            max-width: 400px;
            width: 100%;
            max-height: 550px;
            overflow: hidden;
            aspect-ratio: 8 / 11;
            border: none;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 7px 15px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            flex-direction: column;
        }

        #embed-container.active {
            display: flex;
        }

        /* ── Iframe ── */
        #embed-floating-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ── Burbuja de Bienvenida ── */
        .welcome-bubble-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #0076b6 0%, #00a1e4 100%);
            padding: 15px 25px 15px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 1000;
            animation: slideIn 0.5s ease-out, bounce 3s infinite ease-in-out;
            transition: transform 0.2s ease;
            min-width: 200px;
        }

        .welcome-bubble-container:hover {
            transform: scale(1.05);
        }

        .welcome-bubble-container.hidden {
            display: none;
        }

        .avatar-wrapper {
            position: absolute;
            left: -15px;
            top: -25px;
            width: 70px;
            height: 70px;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
            border-radius: 50%;
            overflow: hidden;
        }

        .frankie-avatar {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .bubble-content {
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            pointer-events: none;
        }

        .bubble-title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .bubble-subtitle {
            margin: 2px 0 0 0;
            font-size: 0.85rem;
            opacity: 0.9;
            font-weight: 400;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        /* Ajustes para pantallas pequeñas (móviles) */
        @media (max-width: 480px) {
            .welcome-bubble-container {
                right: 10px;
                padding: 12px 20px 12px 45px;
            }

            .avatar-wrapper {
                width: 60px;
                height: 60px;
                top: -20px;
            }
        }
    </style>
    <!-- 2. Estructura del Chat (HTML) -->
    <!-- Overlay para cerrar el chat al hacer clic fuera -->
    <div id="embed-overlay"></div>
    <!-- Contenedor del chat (Iframe) -->
    <div id="embed-container">
        <iframe id="embed-floating-iframe" src="https://staging-app.clona.co/chat/f6f624ae-06d3-4cb1-80e0-02762a789750"
            allow="microphone" allowfullscreen title="Chat clona"></iframe>
    </div>
    <!-- Burbuja de Bienvenida -->
    <div id="welcome-bubble" class="welcome-bubble-container">
        <div class="avatar-wrapper">
            <!-- NOTA: Asegúrate de que la ruta a 'assets/Chatbot.png' sea correcta en el sitio donde lo instales, 
             o reemplázala por una URL absoluta (ej: https://tusitio.com/images/Chatbot.png) -->
            <img src="assets/Chatbot.png" alt="Frankie Avatar" class="frankie-avatar">
        </div>
        <div class="bubble-content">
            <h3 class="bubble-title">¡Hola! Soy Frankie</h3>
            <p class="bubble-subtitle">Tu asistente Virtual 24/7</p>
        </div>
    </div>
    <!-- 3. Funcionalidad del Chat (JavaScript) -->
    <script>
        (function () {
            const overlay = document.getElementById('embed-overlay');
            const container = document.getElementById('embed-container');
            const bubble = document.getElementById('welcome-bubble');
            if (overlay && container && bubble) {
                function openChat() {
                    container.classList.add('active');
                    overlay.classList.add('active');
                    bubble.classList.add('hidden');
                }
                function closeChat() {
                    container.classList.remove('active');
                    overlay.classList.remove('active');
                    bubble.classList.remove('hidden');
                }
                function toggleChat() {
                    if (container.classList.contains('active')) {
                        closeChat();
                    } else {
                        openChat();
                    }
                }
                bubble.addEventListener('click', toggleChat);
                overlay.addEventListener('click', closeChat);
            }
        })();
    </script>
</body>

</html>
